name: Feature request
description: Something the app should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some of this is already designed and waiting to be built — please check
        [the backlog](https://github.com/Joycai/Jellyfin-Media-Management-Tool/blob/main/docs/spec/ui-redesign/backlog.md)
        first. If your request is on it, comment there instead; it helps to
        know what people actually want next.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution — it often has a better answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the app to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?

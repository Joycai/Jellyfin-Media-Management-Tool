name: Native Build

# Compiles the desktop runners, which `flutter test` never does. A PR runs it
# only when native code or the dependency set changes; every push to main runs
# it, which also keeps the macOS and Windows SDK caches warm for release.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - "macos/**"
      - "linux/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"
      - ".github/workflows/build.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev libepoxy-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libjpeg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build ${{ matrix.target }} --release

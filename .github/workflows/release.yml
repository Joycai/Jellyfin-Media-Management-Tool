name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (leave empty to read from pubspec.yaml, e.g. 1.2.3)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (review before publishing)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_BASENAME: jellyfin-media-management-tool

jobs:
  check:
    name: Check
    uses: ./.github/workflows/pr-check.yml

  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # pubspec line looks like: version: 0.9.0+1  ->  0.9.0
            VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version" && exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag v$VERSION)"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # The "## [X.Y.Z]" section, up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## \[/ { in_section = index($0, "## [" v "]") == 1 }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no [$VERSION] section; the release body will only carry the generated notes."
            printf '_No CHANGELOG entry for %s._\n' "$VERSION" > release-notes.md
          fi
          cat release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build-macos:
    name: Build macOS (DMG)
    needs: [prepare, check]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Import macOS signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -n "$MACOS_CERT_P12_BASE64" ] && [ -n "$MACOS_CERT_PASSWORD" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASS="$(openssl rand -hex 24)"
            echo "::add-mask::$KEYCHAIN_PASS"
            P12_PATH="$RUNNER_TEMP/signing-cert.p12"
            printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12_PATH"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

            echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          else
            echo "::notice::macOS signing secrets are not configured; building DMG with ad-hoc signature."
          fi

      - name: Build macOS app
        run: flutter build macos --release

      - name: Sign macOS app
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          scripts/sign_macos.sh sign-app \
            --app "build/macos/Build/Products/Release/Jellyfin Media Management Tool.app" \
            --identity "$MACOS_SIGN_IDENTITY" \
            --keychain "$MACOS_KEYCHAIN_PATH"

      - name: Create DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install create-dmg
          APP_PATH="build/macos/Build/Products/Release/Jellyfin Media Management Tool.app"
          DMG_NAME="${APP_BASENAME}-${VERSION}-macos.dmg"
          mkdir -p dist
          create-dmg \
            --volname "Jellyfin Media Management Tool" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 180 \
            --icon "Jellyfin Media Management Tool.app" 150 180 \
            "dist/${DMG_NAME}" \
            "${APP_PATH}"

      - name: Sign and notarize DMG
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="dist/${APP_BASENAME}-${VERSION}-macos.dmg"
          scripts/sign_macos.sh sign-dmg \
            --dmg "$DMG_PATH" \
            --identity "$MACOS_SIGN_IDENTITY" \
            --keychain "$MACOS_KEYCHAIN_PATH"

          if [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ]; then
            P8_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$P8_PATH"
            scripts/sign_macos.sh notarize \
              --target "$DMG_PATH" \
              --api-key "$P8_PATH" \
              --api-key-id "$APPLE_API_KEY_ID" \
              --api-issuer "$APPLE_API_ISSUER_ID"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            scripts/sign_macos.sh notarize \
              --target "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --apple-password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
          else
            echo "::warning::DMG is signed with Developer ID but not notarized (Apple notarization secrets are not configured)."
          fi

      - name: Clean up signing credentials
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/signing-cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (Installer + Portable)
    needs: [prepare, check]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows app
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/${env:APP_BASENAME}-${env:VERSION}-windows-portable.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The runner image ships Inno Setup 6; install it only if that changes.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${env:VERSION}" "scripts\inno_setup.iss"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (tar.gz)
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libx11-dev libxi-dev \
            libmpv-dev libepoxy-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libjpeg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux app
        run: flutter build linux --release

      - name: Create tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          # The bundle is relocatable; it needs libmpv, FFmpeg and libjpeg from
          # the system at run time (see AGENTS.md, Platform-specific notes).
          tar -C build/linux/x64/release -czf \
            "dist/${APP_BASENAME}-${VERSION}-linux-x64.tar.gz" \
            --transform "s,^bundle,${APP_BASENAME}-${VERSION}," bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          # The CHANGELOG section comes first; GitHub appends its generated notes.
          body_path: artifacts/release-notes/release-notes.md
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.tar.gz

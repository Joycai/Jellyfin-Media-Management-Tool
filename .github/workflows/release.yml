name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (leave empty to read from pubspec.yaml, e.g. 1.2.3)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (review before publishing)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_BASENAME: jellyfin-media-management-tool

jobs:
  check:
    name: Check
    uses: ./.github/workflows/pr-check.yml

  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # pubspec line looks like: version: 0.9.0+1  ->  0.9.0
            VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version" && exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag v$VERSION)"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # The "## [X.Y.Z]" section, up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## \[/ { in_section = index($0, "## [" v "]") == 1 }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no [$VERSION] section; the release body will only carry the generated notes."
            printf '_No CHANGELOG entry for %s._\n' "$VERSION" > release-notes.md
          fi
          cat release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-macos:
    name: Build macOS (DMG)
    needs: [prepare, check]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install create-dmg
          APP_PATH="build/macos/Build/Products/Release/Jellyfin Media Management Tool.app"
          DMG_NAME="${APP_BASENAME}-${VERSION}-macos.dmg"
          mkdir -p dist
          create-dmg \
            --volname "Jellyfin Media Management Tool" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 180 \
            --icon "Jellyfin Media Management Tool.app" 150 180 \
            "dist/${DMG_NAME}" \
            "${APP_PATH}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (Installer + Portable)
    needs: [prepare, check]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows app
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/${env:APP_BASENAME}-${env:VERSION}-windows-portable.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The runner image ships Inno Setup 6; install it only if that changes.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${env:VERSION}" "scripts\inno_setup.iss"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (tar.gz)
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev libepoxy-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libjpeg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux app
        run: flutter build linux --release

      - name: Create tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          # The bundle is relocatable; it needs libmpv, FFmpeg and libjpeg from
          # the system at run time (see CLAUDE.md, Platform-specific notes).
          tar -C build/linux/x64/release -czf \
            "dist/${APP_BASENAME}-${VERSION}-linux-x64.tar.gz" \
            --transform "s,^bundle,${APP_BASENAME}-${VERSION}," bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          # The CHANGELOG section comes first; GitHub appends its generated notes.
          body_path: artifacts/release-notes/release-notes.md
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
